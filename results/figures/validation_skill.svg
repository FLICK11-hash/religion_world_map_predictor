">Better than persistence (interval below 0)</text><rect x="663.0" y="88.0" width="13" height="13" rx="2" fill="#a32a28"/><text x="682.0" y="99.0" font-size="12.5" fill="#0b0b0b" text-anchor="start">Worse (interval above 0)</text><rect x="870.0" y="88.0" width="13" height="13" rx="2" fill="#8a8984"/><text x="889.0" y="99.0" font-size="12.5" fill="#0b0b0b" text-anchor="start">Not distinguishable</text><text x="30.0" y="430.0" font-size="11.5" fill="#8a8984" text-anchor="start">Intervals from 4,000 bootstrap resamples of countries. Countries in the same decade share common shocks, which this interval does not capture; the decade-level sign-flip p-value on the right is the</text><text x="30.0" y="446.0" font-size="11.5" fill="#8a8984" text-anchor="start">conservative test (with four decades it cannot fall below 0.125). Source: data/validation/inference.csv</text></svg>