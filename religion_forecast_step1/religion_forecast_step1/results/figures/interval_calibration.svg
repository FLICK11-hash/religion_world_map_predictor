.9" font-size="12" fill="#0b0b0b" text-anchor="end">Other</text><text x="864.4" y="345.9" font-size="11" fill="#52514e" text-anchor="start">3.7 pp  (19x wider than claimed)</text><rect x="700.0" y="297.6" width="156.2" height="13" rx="2" fill="#1baf7a"/><g><circle cx="728.1" cy="304.1" r="4" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><circle cx="728.1" cy="304.1" r="11" fill="transparent"><title>Islam: model half-width 0.67 pp</title></circle></g><text x="692.0" y="308.1" font-size="12" fill="#0b0b0b" text-anchor="end">Islam</text><text x="864.2" y="308.1" font-size="11" fill="#52514e" text-anchor="start">3.7 pp  (6x wider than claimed)</text><rect x="700.0" y="259.8" width="27.8" height="13" rx="2" fill="#eb6834"/><g><circle cx="704.7" cy="266.3" r="4" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><circle cx="704.7" cy="266.3" r="11" fill="transparent"><title>Hinduism: model half-width 0.11 pp</title></circle></g><text x="692.0" y="270.3" font-size="12" fill="#0b0b0b" text-anchor="end">Hinduism</text><text x="735.8" y="270.3" font-size="11" fill="#52514e" text-anchor="start">0.7 pp  (6x wider than claimed)</text><rect x="700.0" y="222.0" width="21.3" height="13" rx="2" fill="#d8a93a"/><g><circle cx="705.1" cy="228.5" r="4" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><circle cx="705.1" cy="228.5" r="11" fill="transparent"><title>Buddhism: model half-width 0.12 pp</title></circle></g><text x="692.0" y="232.5" font-size="12" fill="#0b0b0b" text-anchor="end">Buddhism</text><text x="729.3" y="232.5" font-size="11" fill="#52514e" text-anchor="start">0.5 pp  (4x wider than claimed)</text><rect x="700.0" y="184.2" width="3.8" height="13" rx="2" fill="#4a3aa7"/><g><circle cx="701.1" cy="190.7" r="4" fill="#0b0b0b" stroke="#ffffff" stroke-width="2"/><circle cx="701.1" cy="190.7" r="11" fill="transparent"><title>Judaism: model half-width 0.03 pp</title></circle></g><text x="692.0" y="194.7" font-size="12" fill="#0b0b0b" text-anchor="end">Judaism</text><text x="711.8" y="194.7" font-size="11" fill="#52514e" text-anchor="start">0.1 pp  (3x wider than claimed)</text><rect x="700.0" y="88.0" width="13" height="13" rx="2" fill="#8a8984"/><text x="719.0" y="99.0" font-size="12.5" fill="#0b0b0b" text-anchor="start">Error actually made</text><rect x="872.0" y="88.0" width="13" height="13" rx="2" fill="#0b0b0b"/><text x="891.0" y="99.0" font-size="12.5" fill="#0b0b0b" text-anchor="start">Width the model claims</text><text x="30.0" y="548.0" font-size="11.5" fill="#8a8984" text-anchor="start">The intervals the model reports are PARAMETER uncertainty: the spread of outcomes over the drawn parameters. They do not include measurement error in the historical shares, nor country-level</text><text x="30.0" y="564.0" font-size="11.5" fill="#8a8984" text-anchor="start">change the model has no mechanism for. Both left-hand lines being far below the diagonal is the main negative result of this work. Source: data/validation/interval_calibration*.csv</text></svg>