[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "religion-forecast"
version = "0.7.0"
description = "Probabilistic cohort-component projection of religious composition by country, with switching, migration and out-of-sample evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Conrad Flick" }]
# No licence has been chosen yet; see README.md.
keywords = ["statistics", "statistical demography", "population projection", "cohort-component model",
            "probabilistic forecasting", "forecast evaluation", "religious demography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
]
# Abstract dependencies: the ranges the package is intended to work with.
# Only the exact set in requirements-lock.txt has been tested end to end.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1,<4",   # pandas engine for the UN migrant-stock workbook
    "requests>=2.31,<3",  # run.py fetch; the projection itself never touches the network
]

[project.optional-dependencies]
# matplotlib PNG versions of the maps. The SVG figures the results use need none of this.
maps = ["matplotlib>=3.8,<4", "geopandas>=1.0,<2", "pyogrio>=0.9"]
# scripts/prepare_pew_panel.py: rebuild the 2010/2020 start state from the Pew workbook.
prepare = ["geopandas>=1.0,<2", "pyogrio>=0.9", "pycountry>=22.3"]
# legacy/: the archived Steps 3-6 machine-learning pipeline. Not tested in the current environment.
legacy = ["lightgbm>=4.5,<5", "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
          "scipy>=1.11", "matplotlib>=3.8,<4", "geopandas>=1.0,<2"]

[project.scripts]
religion-forecast = "religion_forecast.cli:main"

[tool.setuptools]
packages = { find = { include = ["religion_forecast", "religion_forecast.*"] } }
