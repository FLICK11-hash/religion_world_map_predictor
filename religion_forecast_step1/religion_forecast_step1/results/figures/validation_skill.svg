or="start">Better than persistence</text><rect x="500.0" y="84.0" width="13" height="13" rx="2" fill="#a32a28"/><text x="519.0" y="95.0" font-size="12.5" fill="#0b0b0b" text-anchor="start">Worse</text><text x="30.0" y="658.0" font-size="11.5" fill="#8a8984" text-anchor="start">Forward chaining: switching is fitted only on decades that end before the test decade begins, and the strength and residual weights are chosen on earlier test decades only.</text><text x="30.0" y="674.0" font-size="11.5" fill="#8a8984" text-anchor="start">Source: data/validation/validation_summary.csv</text></svg>